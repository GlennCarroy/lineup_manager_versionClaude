<header class="sticky top-0 z-30 border-b border-track-line bg-track-night/90 backdrop-blur">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-4 sm:px-6">
    <a routerLink="/roster" class="flex items-center gap-2">
      <span class="h-7 w-2 -skew-x-12 bg-neon"></span>
      <span class="font-display text-2xl font-extrabold uppercase tracking-wider">
        Lineup<span class="text-neon">Manager</span>
      </span>
    </a>

    <nav class="flex items-center gap-1 font-display text-sm font-bold uppercase tracking-widest">
      <a
        routerLink="/roster"
        routerLinkActive="bg-neon !text-track-night"
        class="rounded-sm px-3 py-2 text-white/70 transition hover:text-white"
      >
        Roster
      </a>
      <a
        routerLink="/game"
        routerLinkActive="bg-neon !text-track-night"
        class="rounded-sm px-3 py-2 text-white/70 transition hover:text-white"
      >
        Game
      </a>
      <button
        type="button"
        (click)="charterDrawer.open()"
        class="rounded-sm px-3 py-2 text-white/70 transition hover:bg-neon hover:text-track-night"
      >
        Charter
      </button>
    </nav>
  </div>
</header>
