<section class="flex h-full max-h-[33vh] min-h-48 flex-col gap-3 rounded-sm border border-track-line bg-track-panel p-4">
  <header class="flex items-center justify-between gap-4">
    <h2 class="font-display text-2xl font-bold uppercase tracking-wide">Track</h2>

    @if (activeJam(); as jam) {
      <p class="font-display text-sm font-bold uppercase tracking-wider text-white/70">
        Jam {{ jam.jamNumber }}
      </p>
    } @else {
      <p class="text-xs uppercase tracking-wider text-white/50">Ajoute un jam pour renseigner les passages</p>
    }
  </header>

  <div class="grid min-h-0 flex-1 grid-cols-2 gap-4">
    <div class="flex min-h-0 flex-col">
      <app-track-field
        class="flex min-h-0 flex-1 flex-col"
        [label]="jammerLabel() || '—'"
        [heat]="jammerHeat()"
        [labels]="jammerLabels"
        [enabled]="enabled()"
        (passageChosen)="addJammerPassage($event)"
      />
    </div>

    <div class="flex min-h-0 flex-col">
      <app-track-field
        class="flex min-h-0 flex-1 flex-col"
        [label]="activeJam()?.lineName ?? '—'"
        [heat]="blockerHeat()"
        [labels]="blockerLabels"
        [enabled]="enabled()"
        (passageChosen)="addBlockerPassage($event)"
      />
    </div>
  </div>
</section>
