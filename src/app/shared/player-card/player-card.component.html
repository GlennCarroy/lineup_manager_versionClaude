<article
  class="relative overflow-hidden rounded-sm border p-4 transition hover:-translate-y-0.5 hover:border-neon"
  [class]="surface()"
  [class.opacity-50]="isMaxed()"
>
  <span class="absolute inset-y-0 left-0 w-1.5" [class]="positionAccent()"></span>

  <div class="flex items-start justify-between gap-3">
    <span class="font-display text-5xl font-extrabold leading-none text-white/90">
      {{ player().playerId }}
    </span>

    <div class="flex flex-wrap justify-end gap-1">
      <span class="rounded-sm px-2 py-1 font-display text-sm font-bold uppercase tracking-wider" [class]="positionAccent()">
        {{ positionLabel() }}
      </span>

      @if (specializationLabel(); as label) {
        <span class="rounded-sm px-2 py-1 font-display text-sm font-bold uppercase tracking-wider" [class]="specializationAccent()">
          {{ label }}
        </span>
      }
    </div>
  </div>

  <h3 class="mt-4 font-display text-2xl font-bold uppercase leading-tight tracking-wide">
    {{ player().derbyName }}
  </h3>
  <p class="mt-1 flex justify-between whitespace-nowrap text-xs uppercase tracking-widest text-white/60">
    <span>Pénalités</span>
    <span class="font-bold text-white">{{ penalties() }}</span>
  </p>
</article>
