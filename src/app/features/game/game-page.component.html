<section class="mx-auto flex h-[calc(100dvh-4.5rem)] max-w-6xl flex-col overflow-hidden px-4 pb-2 pt-5 sm:px-6">
  <header class="mb-5 flex shrink-0 flex-wrap items-end justify-between gap-4">
    <div class="border-l-4 border-neon pl-4">
      <p class="font-display text-sm font-bold uppercase tracking-[0.3em] text-neon">Match</p>
      <h1 class="font-display text-3xl font-extrabold uppercase leading-none tracking-tight sm:text-5xl">Game</h1>
    </div>

    <div class="flex items-center gap-3">
      <a
        routerLink="/game/match"
        class="rounded-sm border border-track-line px-4 py-2 font-display text-sm font-bold uppercase tracking-wider text-white/70 transition hover:border-neon hover:text-white"
      >
        Statistiques et pénalités
      </a>

      <div class="relative">
        <button
          type="button"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
          aria-haspopup="menu"
          aria-label="Menu du match"
          class="rounded-sm border border-track-line px-3 py-1.5 font-display text-xl font-bold leading-none text-white/70 transition hover:border-neon hover:text-white"
        >
          ⋮
        </button>

        @if (menuOpen()) {
          <div class="fixed inset-0 z-10" (click)="closeMenu()"></div>

          <div role="menu" class="absolute right-0 z-20 mt-2 w-64 rounded-sm border border-track-line bg-track-panel p-1 shadow-xl">
            <button
              type="button"
              role="menuitem"
              class="block w-full rounded-sm px-3 py-2 text-left font-display text-sm font-bold uppercase tracking-wider text-emerald-300 transition hover:bg-emerald-500/20"
            >
              Synchroniser la base
            </button>

            <button
              type="button"
              role="menuitem"
              (click)="openResetDialog()"
              class="block w-full rounded-sm px-3 py-2 text-left font-display text-sm font-bold uppercase tracking-wider text-hot transition hover:bg-hot/20"
            >
              Réinitialiser le match
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <div class="flex min-h-0 flex-1 flex-col gap-6">
    <div class="grid shrink-0 grid-cols-1 gap-6 md:grid-cols-[2fr_1fr]">
      <app-track-zone />
      <app-stats-zone />
    </div>

    <app-jams-zone class="flex min-h-0 flex-1 flex-col" />
  </div>

  @if (resetDialogOpen()) {
    <div class="fixed inset-0 z-40 bg-black/60" (click)="cancelReset()"></div>

    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="reset-title"
      class="fixed left-1/2 top-1/2 z-50 w-[90%] max-w-md -translate-x-1/2 -translate-y-1/2 rounded-sm border border-track-line bg-track-panel p-6 shadow-2xl"
    >
      <h2 id="reset-title" class="font-display text-2xl font-extrabold uppercase">Réinitialiser</h2>
      <p class="mt-3 text-white/70">Êtes-vous certain de vouloir réinitialiser les données ?</p>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          (click)="cancelReset()"
          class="rounded-sm border border-track-line px-4 py-2 font-display text-sm font-bold uppercase tracking-wider text-white/70 transition hover:text-white"
        >
          Annuler
        </button>
        <button
          type="button"
          (click)="confirmReset()"
          class="rounded-sm bg-hot px-4 py-2 font-display text-sm font-bold uppercase tracking-wider text-white transition hover:brightness-110"
        >
          Confirmer
        </button>
      </div>
    </div>
  }
</section>
