<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
  <div class="grid grid-cols-2 gap-4">
    <label class="flex flex-col gap-1 text-xs font-semibold uppercase tracking-widest text-white/60">
      Numéro
      <input formControlName="playerId" class="rounded-sm border border-track-line bg-track-night px-3 py-2 text-base normal-case tracking-normal text-white focus:border-neon focus:outline-none" />
    </label>

    <label class="flex flex-col gap-1 text-xs font-semibold uppercase tracking-widest text-white/60">
      Rotation
      <input type="number" min="1" formControlName="rotation" class="rounded-sm border border-track-line bg-track-night px-3 py-2 text-base normal-case tracking-normal text-white focus:border-neon focus:outline-none" />
    </label>
  </div>

  <label class="flex flex-col gap-1 text-xs font-semibold uppercase tracking-widest text-white/60">
    Nom de derby
    <input formControlName="derbyName" class="rounded-sm border border-track-line bg-track-night px-3 py-2 text-base normal-case tracking-normal text-white focus:border-neon focus:outline-none" />
  </label>

  <label class="flex flex-col gap-1 text-xs font-semibold uppercase tracking-widest text-white/60">
    Nom
    <input formControlName="surname" class="rounded-sm border border-track-line bg-track-night px-3 py-2 text-base normal-case tracking-normal text-white focus:border-neon focus:outline-none" />
  </label>

  <div class="grid grid-cols-2 gap-4">
    <label class="flex flex-col gap-1 text-xs font-semibold uppercase tracking-widest text-white/60">
      Poste
      <select formControlName="position" class="rounded-sm border border-track-line bg-track-night px-3 py-2 text-base normal-case tracking-normal text-white focus:border-neon focus:outline-none">
        <option value="B">Blocker</option>
        <option value="J">Jammer</option>
      </select>
    </label>

    @if (!isJammer()) {
      <label class="flex flex-col gap-1 text-xs font-semibold uppercase tracking-widest text-white/60">
        Spécialisation
        <select formControlName="specialization" class="rounded-sm border border-track-line bg-track-night px-3 py-2 text-base normal-case tracking-normal text-white focus:border-neon focus:outline-none">
          <option [ngValue]="null">Aucune</option>
          <option value="P">Pivot</option>
          <option value="O">Offense</option>
        </select>
      </label>
    }
  </div>

  @if (duplicateId()) {
    <p class="text-sm text-hot">Ce numéro est déjà utilisé par une autre joueuse.</p>
  }

  @if (form.invalid && form.touched) {
    <p class="text-sm text-hot">Numéro, noms et rotation sont obligatoires.</p>
  }

  <div class="flex justify-end gap-2 pt-2">
    <button type="button" (click)="cancelled.emit()" class="rounded-sm border border-track-line px-4 py-2 font-display text-sm font-bold uppercase tracking-wider text-white/70 transition hover:border-white/40 hover:text-white">
      Annuler
    </button>
    <button type="submit" class="rounded-sm bg-neon px-4 py-2 font-display text-sm font-bold uppercase tracking-wider text-track-night transition hover:brightness-110">
      Enregistrer
    </button>
  </div>
</form>
